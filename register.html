<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Registration | JobLynk.live</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<h1>Candidate Registration</h1>

<form id="registerForm">

<p>
<input
type="text"
id="fullname"
placeholder="Full Name"
required>
</p>

<p>
<input
type="email"
id="email"
placeholder="Email Address"
required>
</p>

<p>
<input
type="email"
id="confirmEmail"
placeholder="Confirm Email Address"
required>
</p>

<p>
<input
type="tel"
id="phone"
placeholder="Phone Number"
required>
</p>

<p>
<input
type="password"
id="password"
placeholder="Password (min 8 chars, upper, lower, number)"
required>
</p>

<p>
<label style="display:flex;align-items:center;gap:8px;color:#555;font-size:0.95rem;">
<input
type="checkbox"
id="optIn"
style="width:auto;">
I'd like to receive job alerts and updates from JobLynk.live
</label>
</p>

<p>
<button type="submit">Create Account</button>
</p>

</form>

<div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/register.js"></script>

</body>

</html>
